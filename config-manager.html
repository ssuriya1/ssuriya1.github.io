<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Config Manager</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-bg: #0a192f;
            --secondary-bg: #112240;
            --accent-color: #64ffda;
            --text-primary: #ccd6f6;
            --text-secondary: #8892b0;
            --text-muted: #495670;
            --border-color: rgba(100, 255, 218, 0.2);
            --shadow-light: rgba(100, 255, 218, 0.1);
            --shadow-medium: rgba(100, 255, 218, 0.2);
            --gradient-primary: linear-gradient(135deg, var(--accent-color), #4fd1c7);
            --transition-fast: 0.2s ease;
            --transition-medium: 0.3s ease;
            --border-radius: 8px;
            --border-radius-large: 12px;
            --spacing-xs: 0.5rem;
            --spacing-sm: 1rem;
            --spacing-md: 1.5rem;
            --spacing-lg: 2rem;
            --spacing-xl: 3rem;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--primary-bg);
            color: var(--text-primary);
            line-height: 1.6;
            padding: var(--spacing-lg);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: var(--spacing-xl);
            color: var(--accent-color);
            font-size: clamp(2rem, 4vw, 3rem);
            font-weight: 600;
        }

        .section-header {
            text-align: center;
            margin-bottom: var(--spacing-xl);
        }

        .section-label {
            display: inline-flex;
            align-items: center;
            gap: var(--spacing-xs);
            background: rgba(100, 255, 218, 0.1);
            color: var(--accent-color);
            padding: var(--spacing-xs) var(--spacing-sm);
            border-radius: 20px;
            border: 1px solid var(--border-color);
            font-size: 0.9rem;
            margin-bottom: var(--spacing-sm);
        }

        .section-title {
            color: var(--text-primary);
            font-size: clamp(1.5rem, 3vw, 2rem);
            margin-bottom: var(--spacing-sm);
        }

        section {
            background: var(--secondary-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-large);
            padding: var(--spacing-xl);
            margin-bottom: var(--spacing-lg);
            transition: var(--transition-medium);
        }

        section:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px var(--shadow-light);
        }

        .form-group {
            margin-bottom: var(--spacing-md);
        }

        label {
            display: block;
            margin-bottom: var(--spacing-xs);
            color: var(--text-secondary);
            font-weight: 500;
        }

        input, textarea, select {
            width: 100%;
            padding: var(--spacing-sm);
            background: var(--primary-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            color: var(--text-primary);
            font-family: inherit;
            transition: var(--transition-fast);
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(100, 255, 218, 0.1);
        }

        input::placeholder, textarea::placeholder {
            color: var(--text-muted);
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .btn-primary, .btn-secondary {
            display: inline-flex;
            align-items: center;
            gap: var(--spacing-xs);
            padding: var(--spacing-sm) var(--spacing-lg);
            border-radius: var(--border-radius);
            font-weight: 600;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: var(--transition-medium);
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: var(--gradient-primary);
            color: var(--primary-bg);
            box-shadow: 0 4px 15px var(--shadow-light);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px var(--shadow-medium);
        }

        .btn-secondary {
            background: transparent;
            color: var(--accent-color);
            border: 2px solid var(--accent-color);
        }

        .btn-secondary:hover {
            background: var(--accent-color);
            color: var(--primary-bg);
            transform: translateY(-2px);
        }

        .btn-remove {
            background: #ff4757;
            color: white;
            margin-top: var(--spacing-sm);
        }

        .btn-remove:hover {
            background: #ff3742;
        }

        .skill-item, .cert-item, .contact-item {
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            padding: var(--spacing-md);
            margin-bottom: var(--spacing-md);
            background: var(--primary-bg);
            transition: var(--transition-medium);
        }

        .skill-item:hover, .cert-item:hover, .contact-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px var(--shadow-light);
        }

        .accordion {
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            margin-bottom: var(--spacing-sm);
        }

        .accordion-header {
            background: var(--secondary-bg);
            padding: var(--spacing-md);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: var(--border-radius) var(--border-radius) 0 0;
            transition: var(--transition-fast);
        }

        .accordion-header:hover {
            background: rgba(17, 34, 64, 0.8);
        }

        .accordion-header i {
            transition: var(--transition-medium);
        }

        .accordion-header i.rotate {
            transform: rotate(180deg);
        }

        .accordion-content {
            padding: 0 var(--spacing-md);
            max-height: 0;
            overflow: hidden;
            transition: max-height var(--transition-medium), padding var(--transition-medium);
        }

        .accordion-content.active {
            padding: var(--spacing-md);
            max-height: 1000px;
        }

        .json-output {
            background: var(--primary-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            padding: var(--spacing-md);
            font-family: 'Fira Code', 'Courier New', monospace;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
            cursor: pointer;
            position: relative;
            transition: var(--transition-fast);
            margin-top: var(--spacing-md);
        }

        .json-output:hover {
            border-color: var(--accent-color);
        }

        .json-output:hover::after {
            content: 'Click to copy';
            position: absolute;
            top: var(--spacing-sm);
            right: var(--spacing-sm);
            background: var(--accent-color);
            color: var(--primary-bg);
            padding: var(--spacing-xs) var(--spacing-sm);
            border-radius: var(--border-radius);
            font-size: 0.8rem;
            font-family: inherit;
        }

        .config-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: var(--spacing-lg);
        }

        @media (max-width: 768px) {
            .config-grid {
                grid-template-columns: 1fr;
            }
            
            body {
                padding: var(--spacing-sm);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="section-header">
            <span class="section-label">
                <i class="fas fa-cog"></i>
                Configuration
            </span>
            <h1 class="section-title">Portfolio Configuration Manager</h1>
        </div>
        
        <div class="config-grid">
            <section>
                <div class="section-header">
                    <h2 class="section-title">Personal Information</h2>
                </div>
                <div class="form-group">
                    <label>Name:</label>
                    <input type="text" id="name" value="Suriya S">
                </div>
                <div class="form-group">
                    <label>Logo:</label>
                    <input type="text" id="logo" value="SS">
                </div>
                <div class="form-group">
                    <label>Typing Texts (comma separated):</label>
                    <input type="text" id="typingTexts" value="Full Stack Developer,Cloud Developer,Problem Solver,DevOps Engineer">
                </div>
            </section>

            <section>
                <div class="section-header">
                    <h2 class="section-title">About Section</h2>
                </div>
                <div class="form-group">
                    <label>Description:</label>
                    <textarea id="aboutDescription" style="height: 150px; width: 100%;">Proficient developer with strong focus on Angular. Skilled in building high-quality, responsive web applications with CMS and integrating with APIs. Dedicated to streamlining development workflows and leveraging automation tools like GitHub Actions and AWS for efficient deployment. Passionate about learning new technologies and skills.</textarea>
                </div>
            </section>
        </div>

        <section>
            <div class="accordion">
                <div class="accordion-header" onclick="toggleAccordion('skills')">
                    <h2>Skills Management</h2>
                    <i class="fas fa-chevron-down" id="skills-icon"></i>
                </div>
                <div class="accordion-content" id="skills-content">
                    <div id="skills-container">
                        <!-- Skills will be loaded from config -->
                    </div>
                    <button class="btn-primary" onclick="addSkillCategory()">Add Skill Category</button>
                </div>
            </div>
        </section>

        <section>
            <div class="accordion">
                <div class="accordion-header" onclick="toggleAccordion('certifications')">
                    <h2>Certifications</h2>
                    <i class="fas fa-chevron-down" id="certifications-icon"></i>
                </div>
                <div class="accordion-content" id="certifications-content">
                    <div id="certifications-container">
                        <div class="cert-item">
                            <div class="form-group">
                                <label>Title:</label>
                                <input type="text" class="cert-title" value="GitHub Foundations">
                            </div>
                            <div class="form-group">
                                <label>URL:</label>
                                <input type="url" class="cert-url" value="https://www.credly.com/badges/b184c9cb-2f6a-45aa-b085-823be663b434">
                            </div>
                            <div class="form-group">
                                <label>Description (optional):</label>
                                <textarea class="cert-description" placeholder="Brief description of the certification"></textarea>
                            </div>
                            <div class="form-group">
                                <label>Date Earned (optional):</label>
                                <input type="date" class="cert-date">
                            </div>
                            <button class="btn-primary btn-remove" onclick="removeCertification(this)">Remove</button>
                        </div>
                    </div>
                    <button class="btn-primary" onclick="addCertification()">Add Certification</button>
                </div>
            </div>
        </section>

        <div class="config-grid">
            <section>
                <div class="section-header">
                    <h2 class="section-title">Contact Information</h2>
                </div>
                <div id="contact-container">
                    <div class="contact-item">
                        <div class="form-group">
                            <label>Platform:</label>
                            <select class="contact-platform">
                                <option value="linkedin">LinkedIn</option>
                                <option value="github">GitHub</option>
                                <option value="twitter">Twitter</option>
                                <option value="email">Email</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>URL/Email:</label>
                            <input type="text" class="contact-url" value="https://www.linkedin.com/in/ssuriya1/">
                        </div>
                        <button class="btn-primary btn-remove" onclick="removeContact(this)">Remove</button>
                    </div>
                </div>
                <button class="btn-primary" onclick="addContact()">Add Contact</button>
                <div class="form-group">
                    <label>GitHub Username:</label>
                    <input type="text" id="githubUsername" value="ssuriya1">
                </div>
            </section>
        </div>

        <section>
            <div class="section-header">
                <h2 class="section-title">Generated Configuration</h2>
            </div>
            <button class="btn-primary" onclick="generateConfig()">Generate Config</button>
            <div id="configOutput" class="json-output" onclick="copyToClipboard()"></div>
        </section>
    </div>

    <script>
        let currentConfig = {};

        function toggleAccordion(section) {
            const content = document.getElementById(section + '-content');
            const icon = document.getElementById(section + '-icon');
            
            content.classList.toggle('active');
            icon.classList.toggle('rotate');
        }

        function copyToClipboard() {
            const output = document.getElementById('configOutput');
            navigator.clipboard.writeText(output.textContent).then(() => {
                const originalText = output.textContent;
                output.textContent = 'Copied to clipboard!';
                setTimeout(() => {
                    output.textContent = originalText;
                }, 1000);
            });
        }

        async function loadExistingConfig() {
            try {
                const response = await fetch('./config.json');
                currentConfig = await response.json();
                populateForm();
            } catch (error) {
                console.error('Could not load existing config:', error);
                generateConfig();
            }
        }

        function populateForm() {
            document.getElementById('name').value = currentConfig.personal?.name || '';
            document.getElementById('logo').value = currentConfig.personal?.logo || '';
            document.getElementById('typingTexts').value = currentConfig.personal?.typingTexts?.join(',') || '';
            document.getElementById('aboutDescription').value = currentConfig.about?.description || '';
            populateSkills();
            populateCertifications();
            populateContacts();
            document.getElementById('githubUsername').value = currentConfig.projects?.github?.username || '';
        }

        function populateSkills() {
            const container = document.getElementById('skills-container');
            container.innerHTML = '';
            
            if (currentConfig.about?.skills) {
                Object.entries(currentConfig.about.skills).forEach(([category, skills]) => {
                    addSkillCategory(category, skills);
                });
            }
        }

        function populateCertifications() {
            const container = document.getElementById('certifications-container');
            container.innerHTML = '';
            
            if (currentConfig.experience?.items) {
                currentConfig.experience.items.forEach(cert => {
                    addCertificationWithData(cert);
                });
            }
        }

        function addSkillCategory(category = '', skills = []) {
            const container = document.getElementById('skills-container');
            const skillItem = document.createElement('div');
            skillItem.className = 'skill-item';
            skillItem.innerHTML = `
                <div class="form-group">
                    <label>Category:</label>
                    <input type="text" class="skill-category-name" value="${category}" placeholder="e.g., Frontend">
                </div>
                <div class="form-group">
                    <label>Skills (comma separated):</label>
                    <input type="text" class="skill-list-input" value="${skills.join(', ')}" placeholder="HTML, CSS, JavaScript">
                </div>
                <button class="btn-primary btn-remove" onclick="removeSkillCategory(this)">Remove Category</button>
            `;
            container.appendChild(skillItem);
        }

        function removeSkillCategory(button) {
            button.parentElement.remove();
        }

        function addCertificationWithData(cert = {}) {
            const container = document.getElementById('certifications-container');
            const certItem = document.createElement('div');
            certItem.className = 'cert-item';
            certItem.innerHTML = `
                <div class="form-group">
                    <label>Title:</label>
                    <input type="text" class="cert-title" value="${cert.title || ''}" placeholder="Certification Title">
                </div>
                <div class="form-group">
                    <label>URL:</label>
                    <input type="url" class="cert-url" value="${cert.url || ''}" placeholder="https://...">
                </div>
                <div class="form-group">
                    <label>Description (optional):</label>
                    <textarea class="cert-description" placeholder="Brief description">${cert.description || ''}</textarea>
                </div>
                <div class="form-group">
                    <label>Date Earned (optional):</label>
                    <input type="date" class="cert-date" value="${cert.dateEarned || ''}">
                </div>
                <button class="btn-primary btn-remove" onclick="removeCertification(this)">Remove</button>
            `;
            container.appendChild(certItem);
        }

        function addCertification() {
            addCertificationWithData();
        }

        function removeCertification(button) {
            button.parentElement.remove();
        }

        function populateContacts() {
            const container = document.getElementById('contact-container');
            container.innerHTML = '';
            
            if (currentConfig.contact?.social) {
                currentConfig.contact.social.forEach(contact => {
                    addContactWithData(contact);
                });
            }
        }

        function addContactWithData(contact = {}) {
            const container = document.getElementById('contact-container');
            const contactItem = document.createElement('div');
            contactItem.className = 'contact-item';
            
            const platformMap = {
                'fab fa-linkedin': 'linkedin',
                'fab fa-github': 'github', 
                'fab fa-twitter': 'twitter',
                'fas fa-envelope': 'email'
            };
            
            const platform = platformMap[contact.icon] || 'linkedin';
            
            contactItem.innerHTML = `
                <div class="form-group">
                    <label>Platform:</label>
                    <select class="contact-platform">
                        <option value="linkedin" ${platform === 'linkedin' ? 'selected' : ''}>LinkedIn</option>
                        <option value="github" ${platform === 'github' ? 'selected' : ''}>GitHub</option>
                        <option value="twitter" ${platform === 'twitter' ? 'selected' : ''}>Twitter</option>
                        <option value="email" ${platform === 'email' ? 'selected' : ''}>Email</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>URL/Email:</label>
                    <input type="text" class="contact-url" value="${contact.url || ''}">
                </div>
                <button class="btn-primary btn-remove" onclick="removeContact(this)">Remove</button>
            `;
            container.appendChild(contactItem);
        }

        function addContact() {
            addContactWithData();
        }

        function removeContact(button) {
            button.parentElement.remove();
        }

        function generateConfig() {
            const skillItems = document.querySelectorAll('.skill-item');
            const skills = {};
            skillItems.forEach(item => {
                const category = item.querySelector('.skill-category-name').value;
                const skillList = item.querySelector('.skill-list-input').value;
                if (category && skillList) {
                    skills[category] = skillList.split(',').map(s => s.trim()).filter(s => s);
                }
            });

            const certItems = document.querySelectorAll('.cert-item');
            const certifications = Array.from(certItems).map(item => {
                const cert = {
                    title: item.querySelector('.cert-title').value,
                    url: item.querySelector('.cert-url').value
                };
                
                const description = item.querySelector('.cert-description').value;
                const date = item.querySelector('.cert-date').value;
                
                if (description) cert.description = description;
                if (date) cert.dateEarned = date;
                
                return cert;
            }).filter(cert => cert.title && cert.url);

            const config = {
                personal: {
                    name: document.getElementById('name').value,
                    logo: document.getElementById('logo').value,
                    title: "Portfolio",
                    typingTexts: document.getElementById('typingTexts').value.split(',').map(s => s.trim())
                },
                navigation: [
                    { name: "Home", href: "#home" },
                    { name: "About", href: "#about" },
                    { name: "Experience", href: "#experience" },
                    { name: "Projects", href: "#projects" },
                    { name: "Contact", href: "#contact" }
                ],
                about: {
                    title: "About Me",
                    description: document.getElementById('aboutDescription').value,
                    skills: skills
                },
                experience: {
                    title: "Certifications",
                    items: certifications
                },
                projects: {
                    title: "Featured Projects",
                    github: {
                        username: document.getElementById('githubUsername').value,
                        initialCount: 4
                    }
                },
                contact: {
                    title: "Let's Connect",
                    social: Array.from(document.querySelectorAll('.contact-item')).map(item => {
                        const platform = item.querySelector('.contact-platform').value;
                        const url = item.querySelector('.contact-url').value;
                        
                        const iconMap = {
                            'linkedin': 'fab fa-linkedin',
                            'github': 'fab fa-github',
                            'twitter': 'fab fa-twitter',
                            'email': 'fas fa-envelope'
                        };
                        
                        return {
                            name: platform.charAt(0).toUpperCase() + platform.slice(1),
                            url: url,
                            icon: iconMap[platform]
                        };
                    }).filter(contact => contact.url),
                    form: {
                        fields: [
                            { name: "name", type: "text", placeholder: "Your Name", required: true },
                            { name: "email", type: "email", placeholder: "Your Email", required: true },
                            { name: "message", type: "textarea", placeholder: "Your Message", required: true }
                        ],
                        submitText: "Send Message",
                        submitIcon: "fas fa-paper-plane"
                    }
                },
                settings: {
                    typingSpeed: 100,
                    typingPause: 3000,
                    theme: {
                        primaryColor: "#0a192f",
                        secondaryColor: "#64ffda",
                        accentColor: "#64ffda"
                    }
                }
            };

            document.getElementById('configOutput').textContent = JSON.stringify(config, null, 2);
        }

        loadExistingConfig().then(() => {
            toggleAccordion('skills');
        });
    </script>
</body>
</html>
